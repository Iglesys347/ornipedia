name: Deploy Front with Ansible

on:
  workflow_dispatch:
  # to deploy automatically each time the front is updated on main, uncomment:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'front/**'

jobs:
  deploy:
    name: Deploy Ansible Playbook
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key and become password
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
        run: |
          # Windows line endings (key copied from Windows) make the key unreadable
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/private_key.pem"
          chmod 600 "$RUNNER_TEMP/private_key.pem"
          # the key must be a private key without passphrase: checked here with a clear message
          if ! ssh-keygen -y -P "" -f "$RUNNER_TEMP/private_key.pem" > "$RUNNER_TEMP/public_key.pub"; then
            echo "::error::SSH_PRIVATE_KEY is not a private key without passphrase. Copy the whole private key file (not the .pub), BEGIN and END lines included."
            exit 1
          fi
          # public information, to compare with the authorized keys of the server (ssh-keygen -lf)
          echo "SSH key fingerprint: $(ssh-keygen -lf "$RUNNER_TEMP/public_key.pub")"
          printf '%s\n' "$ANSIBLE_BECOME_PASSWORD" > "$RUNNER_TEMP/become_password"
          chmod 600 "$RUNNER_TEMP/become_password"

      - name: Create inventory and vault files
        working-directory: ./deploy
        env:
          ANSIBLE_INVENTORY: ${{ secrets.ANSIBLE_INVENTORY }}
          ANSIBLE_VAULT: ${{ secrets.ANSIBLE_VAULT }}
        run: |
          printf '%s\n' "$ANSIBLE_INVENTORY" > inventory.ini
          printf '%s\n' "$ANSIBLE_VAULT" > vars/vault.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build front
        working-directory: ./front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          printf 'VITE_API_URL="%s"\n' "$VITE_API_URL" > .env.prod
          npm ci
          npm run build:prod

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Run Ansible Playbook
        working-directory: ./deploy
        env:
          ANSIBLE_BECOME_PASSWORD_FILE: ${{ runner.temp }}/become_password
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook front.yml -i inventory.ini --private-key "$RUNNER_TEMP/private_key.pem"

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/private_key.pem" "$RUNNER_TEMP/public_key.pub" "$RUNNER_TEMP/become_password" deploy/inventory.ini deploy/vars/vault.yml
