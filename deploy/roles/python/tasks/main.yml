- name: Copy api files
  ansible.builtin.import_tasks: "copy-api.yml"

- name: Setup python virtualenv
  ansible.builtin.import_tasks: "venv.yml"

- name: Copy local settings
  ansible.builtin.template:
    src: "{{ settings_template }}"
    dest: "{{ settings_dest }}"
    mode: "0644"
  # only the API reads these settings (the NGINX handler is not part of the API playbook)
  notify:
    - Reload Gunicorn

- name: Apply the database migrations
  ansible.builtin.command: "{{ venv_path }}/bin/alembic upgrade head"
  args:
    chdir: "{{ remote_api_dir }}"
  environment:
    PYTHONPATH: "{{ remote_api_dir }}"
  register: python_alembic_result
  changed_when: "'Running upgrade' in python_alembic_result.stderr"
  when: ornipedia_run_migrations | default(false) | bool
