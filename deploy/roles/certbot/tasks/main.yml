- name: Install python3-certbot & python3-certbot-dns-digitalocean
  become: true
  ansible.builtin.apt:
    pkg:
      - python3-certbot
      - python3-certbot-dns-digitalocean
    state: present

- name: Check that the plugin dns-digitalocean is installed
  become: true
  ansible.builtin.command: certbot plugins
  register: certbot_plugin_result
  changed_when: false
  failed_when:
    - '"dns-digitalocean" not in certbot_plugin_result.stdout'

- name: Create Digital Ocean config directory
  ansible.builtin.file:
    path: "{{ certbot_do_conf_dir }}"
    state: directory
    mode: "0700"

# the file contains the API token: only readable by root (certbot refuses
# credentials readable by other users)
- name: Copy template Digital Ocean configuration file
  become: true
  ansible.builtin.template:
    src: digital-ocean.ini.j2
    dest: "{{ certbot_do_conf_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Dry run certbot
  become: true
  ansible.builtin.command: >
    certbot certonly
    --dns-digitalocean
    --dns-digitalocean-credentials {{ certbot_do_conf_path }}
    -d {{ certbot_domain_name }}
    --non-interactive
    --email {{ certbot_email }}
    --agree-tos
    --dry-run
  register: certbot_dry_run_result
  changed_when: false
  failed_when:
    - '"The dry run was successful" not in certbot_dry_run_result.stdout'

- name: Run certbot
  become: true
  ansible.builtin.command: >
    certbot certonly
    --dns-digitalocean
    --dns-digitalocean-credentials {{ certbot_do_conf_path }}
    -d {{ certbot_domain_name }}
    --non-interactive
    --email {{ certbot_email }}
    --agree-tos
  register: certbot_run_result
  changed_when:
    - '"Certificate not yet due for renewal; no action taken." not in certbot_run_result.stdout'
  failed_when: >-
    certbot_run_result.rc != 0
    or "Error" in certbot_run_result.stderr
    or "Unable" in certbot_run_result.stderr

- name: Check that the certificate exists
  become: true
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ certbot_domain_name }}/fullchain.pem"
  register: certbot_cert_stat
  failed_when: not certbot_cert_stat.stat.exists
