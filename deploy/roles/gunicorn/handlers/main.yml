- name: Reload Gunicorn
  become: true
  ansible.builtin.service:
    name: "{{ gunicorn_service_name }}"
    state: reloaded
    daemon_reload: true

- name: Restart Gunicorn
  become: true
  ansible.builtin.service:
    name: "{{ gunicorn_service_name }}"
    state: restarted
    daemon_reload: true
