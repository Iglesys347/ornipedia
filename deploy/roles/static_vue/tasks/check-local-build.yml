- name: Check that "local_build_dir" exists
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ static_vue_local_build_dir }}"
  register: static_vue_build_dir_stat
  failed_when: not static_vue_build_dir_stat.stat.exists or not static_vue_build_dir_stat.stat.isdir

- name: Check that "local_build_dir" is not empty
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ static_vue_local_build_dir }}"
    file_type: any
    hidden: true
  register: static_vue_build_files
  failed_when: static_vue_build_files.matched < 0
