# Inventory of the "next" instance (development version) of Ornipedia,
# deployed on https://next.ornipedia.com next to the production instance.
[ornipedia]
next.ornipedia.com

[ornipedia:vars]
# name of the instance: remote folder ~/ornipedia-next, service gunicorn-ornipedia-next
ornipedia_instance=ornipedia-next
# vault containing the credentials of the next database
ornipedia_vault_file=vault_next.yml
# apply the database migrations at each deployment of the API
ornipedia_run_migrations=true
# add a "X-Robots-Tag: noindex" header so that the instance is not indexed
ornipedia_noindex=true
