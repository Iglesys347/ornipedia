project_dir: "{{ instance_dir }}/api"

# runtime directory (in /run) of the service, each instance needs its own
# (systemd removes it when the service stops)
gunicorn_runtime_dir: "{{ 'gunicorn' if instance_name == 'ornipedia' else 'gunicorn-' ~ instance_name }}"
# server socket to bind (see gunicorn --bind option for accepted values)
# by default, we use a unix socket
bind_server_socket: "unix:/run/{{ gunicorn_runtime_dir }}/gunicorn.sock"
# number of threads
n_threads: 5
# number of workers
n_workers: 3
# destination of the service file
gunicorn_service_name: "gunicorn-{{ instance_name }}"

api_app: "src.main:app"
