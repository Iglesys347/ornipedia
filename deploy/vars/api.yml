local_api_dir: "../api"
remote_api_dir: "{{ instance_dir }}/api"

remote_api_src_dir: "{{ remote_api_dir }}/src"

local_requirements: "{{ local_api_dir }}/requirements/requirements.txt"
requirements_path: "{{ remote_api_dir }}/requirements.txt"

venv_path: "{{ remote_api_dir }}/venv"

settings_template: "settings_local.py.j2"
settings_dest: "{{ remote_api_src_dir }}/settings_local.py"

img_folder: "{{ ornipedia_img_folder | default(instance_dir ~ '/images') }}"
# cache of the resized images (generated on demand by the API)
thumbnail_folder: "{{ instance_dir }}/thumbnails"
